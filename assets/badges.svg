<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Quantorv Games Badge Sprite</title>
  <desc>Nine colourful rank badge symbols for the Quantorv Games profile UI.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5b5"/><stop offset=".35" stop-color="#ffd54a"/>
      <stop offset=".68" stop-color="#f5a623"/><stop offset="1" stop-color="#a95b08"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#dce7f0"/>
      <stop offset=".72" stop-color="#8e9eae"/><stop offset="1" stop-color="#526170"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0b5"/><stop offset=".45" stop-color="#d88a4b"/>
      <stop offset="1" stop-color="#7c3e22"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ffd0"/><stop offset=".4" stop-color="#08d549"/>
      <stop offset="1" stop-color="#087a39"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5f5ff"/><stop offset=".45" stop-color="#27b9ff"/>
      <stop offset="1" stop-color="#2147b8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d4ff"/><stop offset=".45" stop-color="#b45cff"/>
      <stop offset="1" stop-color="#5522a8"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1dc"/><stop offset=".45" stop-color="#ff4f7b"/>
      <stop offset="1" stop-color="#991b4d"/>
    </linearGradient>
    <linearGradient id="cosmic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b0"/><stop offset=".28" stop-color="#7bfff0"/>
      <stop offset=".58" stop-color="#7c78ff"/><stop offset=".82" stop-color="#f16cff"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <radialGradient id="darkCore" cx=".35" cy=".25" r=".9">
      <stop offset="0" stop-color="#273c2b"/><stop offset="1" stop-color="#080d09"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset dy="1.2" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <symbol id="rising-star" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 4 39 11 49 10 51 20 59 27 54 36 56 46 45 49 39 58 29 54 19 58 14 49 4 45 8 35 4 26 13 20 15 10 25 12Z" fill="#183b26" stroke="#08d549" stroke-width="2"/>
      <circle cx="32" cy="31" r="18" fill="url(#emerald)" stroke="#d7ffe4" stroke-width="1.5"/>
      <circle cx="32" cy="31" r="14" fill="url(#darkCore)" stroke="#fff1a8" stroke-width="1"/>
      <path d="m32 17 4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.3-8.4-4.4-8.4 4.4 1.6-9.3-6.8-6.6 9.4-1.4Z" fill="url(#gold)" stroke="#fff4c2" stroke-width=".8"/>
      <circle cx="13" cy="15" r="2" fill="#fff5b5"/><circle cx="51" cy="47" r="2" fill="#fff5b5"/>
    </g>
  </symbol>

  <symbol id="achiever" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M15 8h34v8l7 7-4 11-9 5-3 13-8 6-8-6-3-13-9-5-4-11 7-7Z" fill="url(#silver)" stroke="#ffffff" stroke-width="1.4"/>
      <path d="M20 13h24v7l5 5-3 7-8 4-6 13-6-13-8-4-3-7 5-5Z" fill="#263743" stroke="#d9f2ff" stroke-width="1.2"/>
      <circle cx="32" cy="27" r="11" fill="url(#emerald)" stroke="#f3fff7" stroke-width="1.5"/>
      <path d="m32 18 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z" fill="url(#gold)"/>
      <path d="M19 12 14 5l-2 11 8 5M45 12l5-7 2 11-8 5" fill="url(#silver)" stroke="#ffffff" stroke-width="1.3"/>
    </g>
  </symbol>

  <symbol id="trailblazer" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 4 56 18 56 44 32 60 8 44 8 18Z" fill="#123e55" stroke="url(#blue)" stroke-width="3"/>
      <path d="M32 9 51 20 51 41 32 54 13 41 13 20Z" fill="url(#blue)" stroke="#d9fbff" stroke-width="1.2"/>
      <path d="m32 14 5 10 11 1.6-8 7.8 1.9 11-9.9-5.2-9.9 5.2 1.9-11-8-7.8L27 24Z" fill="#11344b" stroke="#fff1b0" stroke-width="1.5"/>
      <path d="m32 18 3.5 7 7.7 1.1-5.6 5.5 1.3 7.7-6.9-3.6-6.9 3.6 1.3-7.7-5.6-5.5 7.7-1.1Z" fill="url(#gold)"/>
      <circle cx="13" cy="15" r="2" fill="#fff"/><circle cx="51" cy="48" r="2" fill="#fff"/>
    </g>
  </symbol>

  <symbol id="champion" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M16 8h32v7h8v12c0 8-5 13-13 15l-4 7H25l-4-7C13 40 8 35 8 27V15h8Z" fill="url(#gold)" stroke="#fff2b3" stroke-width="1.5"/>
      <path d="M16 16h32v8c0 10-6 16-16 16S16 34 16 24Z" fill="#7e4a0c" stroke="#fff7d0" stroke-width="1.2"/>
      <path d="M16 18H12v8c0 5 2 8 7 10M48 18h4v8c0 5-2 8-7 10" fill="none" stroke="#ffeeb0" stroke-width="3" stroke-linecap="round"/>
      <path d="m32 16 4.5 8.5 9.5 1.4-7 6.8 1.7 9.6-8.7-4.6-8.7 4.6 1.7-9.6-7-6.8 9.5-1.4Z" fill="url(#emerald)" stroke="#d5ffe1" stroke-width="1.2"/>
      <path d="M24 48h16l4 7H20Z" fill="url(#gold)" stroke="#fff2b3" stroke-width="1.2"/>
    </g>
  </symbol>

  <symbol id="elite" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 4 39 14 51 10 50 23 60 30 50 38 52 51 39 49 32 60 25 49 12 51 14 38 4 30 14 23 13 10 25 14Z" fill="url(#purple)" stroke="#f6d9ff" stroke-width="1.5"/>
      <circle cx="32" cy="31" r="17" fill="#31134e" stroke="#f2caff" stroke-width="1.5"/>
      <circle cx="32" cy="31" r="13" fill="url(#purple)" stroke="#fff" stroke-width=".8"/>
      <path d="m32 18 4 8 9 1.3-6.5 6.3 1.5 8.9-8-4.2-8 4.2 1.5-8.9-6.5-6.3 9-1.3Z" fill="url(#gold)" stroke="#fff5c4" stroke-width="1"/>
      <path d="M10 10 13 15 18 16 14 20 15 25 10 22 5 25 6 20 2 16 7 15Z" fill="#ffffff"/>
      <path d="M54 42 56 46 61 47 57 50 58 55 54 52 50 55 51 50 47 47 52 46Z" fill="#8fffe2"/>
    </g>
  </symbol>

  <symbol id="legend" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 3 38 13 50 8 49 21 60 28 51 37 54 50 40 49 32 60 24 49 10 50 13 37 4 28 15 21 14 8 26 13Z" fill="url(#gold)" stroke="#fff5c6" stroke-width="1.6"/>
      <circle cx="32" cy="31" r="19" fill="#51300b" stroke="#fff1a8" stroke-width="1.4"/>
      <circle cx="32" cy="31" r="15" fill="url(#gold)" stroke="#fff" stroke-width="1"/>
      <path d="M21 39V23h4l7 9 7-9h4v16h-5v-8l-6 7-6-7v8Z" fill="#53300a" stroke="#fff0a4" stroke-width=".7"/>
      <path d="M18 7 20 12 25 13 21 16 22 21 18 18 14 21 15 16 11 13 16 12Z" fill="#ffffff"/>
      <path d="M51 40 53 45 58 46 54 49 55 54 51 51 47 54 48 49 44 46 49 45Z" fill="#fff3bd"/>
    </g>
  </symbol>

  <symbol id="grandmaster" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 4 39 11 49 8 52 18 60 25 55 35 57 45 46 49 40 58 30 54 20 58 15 49 5 45 9 35 4 25 12 18 15 8 25 11Z" fill="url(#silver)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M32 9 51 21 47 43 32 54 17 43 13 21Z" fill="#1c3444" stroke="url(#blue)" stroke-width="2"/>
      <circle cx="32" cy="30" r="13" fill="url(#purple)" stroke="#f4d7ff" stroke-width="1.5"/>
      <path d="M18 22 24 12 32 19 40 12 46 22 40 28 32 24 24 28Z" fill="url(#gold)" stroke="#fff5c4" stroke-width="1"/>
      <path d="m32 25 3.5 6.5 7.5 1.1-5.5 5.3 1.3 7.5-6.8-3.6-6.8 3.6 1.3-7.5-5.5-5.3 7.5-1.1Z" fill="#ffffff" stroke="#b9f5ff" stroke-width=".8"/>
      <circle cx="10" cy="16" r="2" fill="#fff"/><circle cx="54" cy="48" r="2" fill="#fff"/>
    </g>
  </symbol>

  <symbol id="icon" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <path d="M32 3 38 12 49 8 51 19 60 26 55 36 57 47 45 50 39 59 29 55 19 59 14 49 4 45 8 35 4 25 13 19 15 8 25 12Z" fill="url(#cosmic)" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="32" cy="31" r="18" fill="#10152d" stroke="url(#cosmic)" stroke-width="2"/>
      <circle cx="32" cy="31" r="13" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1"/>
      <path d="m32 16 4.7 9.5 10.5 1.5-7.6 7.4 1.8 10.4-9.4-5-9.4 5 1.8-10.4-7.6-7.4 10.5-1.5Z" fill="url(#cosmic)" stroke="#fff" stroke-width="1"/>
      <circle cx="15" cy="17" r="1.6" fill="#ffffff"/><circle cx="49" cy="43" r="1.6" fill="#ffffff"/>
      <path d="m48 9 1.5 3.5L53 14l-3.5 1.5L48 19l-1.5-3.5L43 14l3.5-1.5Z" fill="#fff"/>
    </g>
