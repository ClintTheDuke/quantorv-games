  <symbol id="quantorv-immortal" viewBox="0 0 64 64">
    <g filter="url(#softShadow)">
      <circle cx="32" cy="32" r="28" fill="#0b1020" stroke="url(#cosmic)" stroke-width="3"/>
      <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="2 3"/>
      <path d="M32 8 39 18 51 15 49 27 58 34 48 41 49 53 37 50 32 59 26 50 14 53 16 41 6 34 15 27 13 15 25 18Z" fill="url(#cosmic)" stroke="#ffffff" stroke-width="1.2"/>
      <path d="M32 15 36 24 46 25 39 32 41 42 32 37 23 42 25 32 18 25 28 24Z" fill="#111a12" stroke="#fff7cb" stroke-width="1"/>
      <path d="M32 20 35.2 26.5 42.5 27.5 37.2 32.6 38.5 40 32 36.5 25.5 40 26.8 32.6 21.5 27.5 28.8 26.5Z" fill="url(#gold)" stroke="#ffffff" stroke-width=".8"/>
      <path d="M9 20 11 24 15 25 12 28 13 32 9 30 5 32 6 28 3 25 7 24Z" fill="#fff"/>
      <path d="M55 38 57 42 61 43 58 46 59 50 55 48 51 50 52 46 49 43 53 42Z" fill="#fff"/>
      <circle cx="20" cy="10" r="1.5" fill="#ffffff"/><circle cx="46" cy="54" r="1.5" fill="#ffffff"/>
    </g>
  </symbol>
</svg>
